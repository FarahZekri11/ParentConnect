# =====================================================================
# Eureka Server - annuaire des microservices ParentConnect
# =====================================================================
spring.application.name=eureka
server.port=${SERVER_PORT:8761}

# Le serveur ne s'inscrit pas auprès de lui-même et ne lit pas d'autre annuaire
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:${server.port}/eureka/

# Développement (une seule instance) : retrait rapide des services arrêtés,
# et pas de mode "self-preservation" qui conserverait des instances mortes
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=10000
eureka.server.wait-time-in-ms-when-sync-empty=0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
