version: '3.8'

services:
  marketplace-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parentconnect-marketplace-service
    restart: unless-stopped
    ports:
      - '3002:8080'
    environment:
      - PORT=8080
      - APP_PORT=8080
      - NODE_ENV=production
      # MongoDB
      - MONGODB_URI=mongodb://marketplace-mongodb:27017/parentconnect_marketplace
      # Service Discovery (Eureka)
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_APP_NAME=MARKETPLACE-SERVICE
      - MARKETPLACE_HOST=parentconnect-marketplace-service
      # Security (Keycloak)
      - KEYCLOAK_URL=http://keycloak:8180
      - KEYCLOAK_REALM=parentconnect
      - KEYCLOAK_CLIENT_ID=marketplace-service
      - KEYCLOAK_REALM_PUBLIC_KEY=${KEYCLOAK_REALM_PUBLIC_KEY:-}
      # Messaging (RabbitMQ)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - RABBITMQ_EXCHANGE=parentconnect.topic
      - RABBITMQ_QUEUE=parentconnect.marketplace.queue
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parentconnect-network

networks:
  parentconnect-network:
    external: true
