server:
  port: ${PORT:8888}

spring:
  application:
    # Nom d'enregistrement Eureka : PARENTCONNECT-CONFIG-SERVER
    name: parentconnect-config-server
  profiles:
    # Profil « native » : la configuration est lue dans un dossier (Backend/config-repo), sans dépôt Git distant
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:/config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
