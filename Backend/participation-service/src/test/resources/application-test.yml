security:
  jwt:
    # La clé publique RS256 du realm de test est injectée par AbstractIntegrationTest
    issuer: http://keycloak:8080/realms/parentconnect

clients:
  event-service:
    api-key: test-internal-key
    connect-timeout: PT1S
    read-timeout: PT1S
    max-attempts: 3
    initial-backoff: PT0.01S

app:
  reconciliation:
    enabled: false

logging:
  level:
    com.parentconnect: INFO
    org.testcontainers: WARN

# Pas d'annuaire Eureka pendant les tests
eureka:
  client:
    enabled: false
