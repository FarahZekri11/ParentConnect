# =====================================================================
# Participation Service — composition d'INTÉGRATION ParentConnect
#
# Contient uniquement mon service et sa base de données dédiée.
# Ne crée PAS l'API Gateway, Keycloak, Eureka ni RabbitMQ : ce sont les serveurs partagés
# de l'intégrateur, joignables sur le réseau externe "parentconnect-network".
# Event Service (Backend/event-service/docker-compose.service.yml) doit être démarré sur le même réseau.
#
# Prérequis : réseau partagé existant (docker network create parentconnect-network)
#             et fichier .env à côté de ce fichier (copier .env.example)
# Lancement : docker compose -f docker-compose.service.yml up -d --build
# =====================================================================
name: parentconnect-participation-service

services:

  participation-postgres:
    image: postgres:16-alpine
    container_name: participation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: participations_db
      POSTGRES_USER: ${PARTICIPATION_DB_USER:-participations_user}
      POSTGRES_PASSWORD: ${PARTICIPATION_DB_PASSWORD:?PARTICIPATION_DB_PASSWORD doit être défini dans .env}
      TZ: ${TZ:-Europe/Paris}
      PGTZ: ${TZ:-Europe/Paris}
    volumes:
      - participation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parentconnect-network

  participation-service:
    build:
      context: .
    image: parentconnect-participation:1.0
    container_name: participation-service
    restart: unless-stopped
    depends_on:
      participation-postgres:
        condition: service_healthy
    environment:
      # Écoute 0.0.0.0:8080 (port interne standard ; aucun port publié : accès via l'API Gateway)
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ""
      # Base de données dédiée
      DB_HOST: participation-postgres
      DB_PORT: 5432
      DB_NAME: participations_db
      DB_USERNAME: ${PARTICIPATION_DB_USER:-participations_user}
      DB_PASSWORD: ${PARTICIPATION_DB_PASSWORD}
      # Keycloak (realm parentconnect, RS256)
      KEYCLOAK_REALM_PUBLIC_KEY: ${KEYCLOAK_REALM_PUBLIC_KEY:?KEYCLOAK_REALM_PUBLIC_KEY doit être défini dans .env}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      GATEWAY_RELAY_ENABLED: ${GATEWAY_RELAY_ENABLED:-true}
      # Eureka partagé
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      # RabbitMQ partagé (exchange parentconnect.topic)
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Appels vers Event Service (nom du conteneur sur le réseau partagé) + clé identique des deux côtés
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY doit être défini dans .env}
      RECONCILIATION_INTERVAL: ${RECONCILIATION_INTERVAL:-PT5M}
      RECONCILIATION_GRACE_SECONDS: ${RECONCILIATION_GRACE_SECONDS:-120}
      TZ: ${TZ:-Europe/Paris}
    networks:
      - parentconnect-network

networks:
  parentconnect-network:
    external: true

volumes:
  participation-postgres-data:
    name: parentconnect-participation-postgres-data
