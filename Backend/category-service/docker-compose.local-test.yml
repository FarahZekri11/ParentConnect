version: '3.8'

services:
  category-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: parentconnect/category-service:local-test
    container_name: parentconnect-category-test
    restart: unless-stopped
    ports:
      - "8003:8080"
    environment:
      APP_NAME: "Category Service (Local Test)"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8003
      APP_PORT: 8080
      PORT: 8080
      DB_CONNECTION: pgsql
      DB_HOST: category-db-test
      DB_PORT: 5432
      DB_DATABASE: category_db
      DB_USERNAME: postgres
      DB_PASSWORD: password123
      AUTO_MIGRATE: "true"
      AUTO_SEED: "false"
      L5_SWAGGER_GENERATE_ALWAYS: "true"
      EUREKA_SERVER_URL: ""
      KEYCLOAK_REALM_PUBLIC_KEY: 
      KEYCLOAK_REALM: parentconnect
      KEYCLOAK_AUTH_SERVER_URL: http://localhost:8180
      JWT_SECRET: super_secret_parentconnect_jwt_key_2026_community
    depends_on:
      category-db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - category-local-net

  category-db-test:
    image: postgres:16-alpine
    container_name: parentconnect-category-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: category_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "54323:5432"
    volumes:
      - category_test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d category_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - category-local-net

volumes:
  category_test_db_data:

networks:
  category-local-net:
    driver: bridge