# ==============================================================================
# ParentConnect API Gateway - Nginx Configuration Snippet for Geo Service
# ==============================================================================
# Crucial Security Rules:
# 1. /api/geo/ is exposed publicly to clients (path is preserved without rewrite)
# 2. /internal/geo/ is strictly BLOCKED from external access (internal services only)
# 3. Propagates or generates X-Request-ID for distributed tracing across services

upstream geo_backend {
    server geo-service:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.parentconnect.local;

    # Generate request ID if not provided by client
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # Public Geo API (Preserves prefix /api/geo)
    location /api/geo/ {
        proxy_pass http://geo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Timeouts and buffers
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public documentation & OpenAPI schema
    location /api/geo/docs {
        proxy_pass http://geo_backend/api/geo/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
    }

    location /api/geo/openapi.json {
        proxy_pass http://geo_backend/api/geo/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
    }

    # Explicitly block access to internal microservice endpoints
    location /internal/ {
        deny all;
        return 404;
    }
}
