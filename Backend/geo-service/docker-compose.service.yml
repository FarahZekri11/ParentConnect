version: "3.8"

services:
  geo-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: parentconnect/geo-service:latest
    container_name: parentconnect-geo-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=geo_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_EXCHANGE=parentconnect.topic
      - RABBITMQ_EVENTS_QUEUE=geo_events_queue
      - EUREKA_ENABLED=true
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - EUREKA_APP_NAME=PARENTCONNECT-GEO-SERVICE
      - EUREKA_INSTANCE_HOST=geo-service
      - EUREKA_INSTANCE_PORT=8080
      - KEYCLOAK_REALM_PUBLIC_KEY=${KEYCLOAK_REALM_PUBLIC_KEY:-}
      - JWT_ALGORITHM=RS256
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-parentconnect-internal-geo-secret-key-32ch}
      - LOCATION_BLUR_M=200
      - BLUR_SALT=${BLUR_SALT:-parentconnect-geo-blur-salt-secret}
      - ADDRESS_VERIFICATION_THRESHOLD=2
      - MAX_SEARCH_RADIUS_M=10000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parentconnect-network

networks:
  parentconnect-network:
    external: true

