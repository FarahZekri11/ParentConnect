# ==============================================================================
# ParentConnect – Nginx Gateway Configuration (sécurisée, production-ready)
# ==============================================================================

# Nombre de workers (auto = 1 worker par cœur CPU disponible)
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # Performances réseau
    # --------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off; # Ne pas révéler la version de Nginx dans les réponses

    # --------------------------------------------------------------------------
    # Logs d'accès structurés en JSON (pour l'agrégation ELK / Loki / Cloud)
    # --------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_id":"$http_x_request_id",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"args":"$args",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_referrer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"scheme":"$scheme"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # --------------------------------------------------------------------------
    # Rate Limiting – zones partagées en mémoire
    # --------------------------------------------------------------------------
    # Zone principale pour l'API REST : 20 requêtes/seconde par IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

    # Zone dédiée aux upgrades WebSocket : 5 connexions/seconde par IP
    limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=5r/s;

    # Zone pour les endpoints de santé (moins restrictif)
    limit_req_zone $binary_remote_addr zone=health_zone:5m rate=10r/s;

    # Zone pour les requêtes globales (toutes routes confondues)
    limit_req_zone $binary_remote_addr zone=global_zone:20m rate=50r/s;

    # Statut de retour en cas de dépassement (429 Too Many Requests)
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Gestion dynamique du header Upgrade pour les connexions WebSocket
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # Upstream vers le microservice Messaging (Go + Gin)
    # --------------------------------------------------------------------------
    upstream messaging_backend {
        server messaging-service:8085;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 75s;
    }

    # ==========================================================================
    # Serveur principal HTTP (port 80 – HTTP en développement)
    # En production, remplacer par HTTPS avec le bloc TLS commenté ci-dessous
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Taille maximale du corps de requête (protection contre les payload trop lourds)
        client_max_body_size 2m;
        client_body_buffer_size 16k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 8k;

        # ------------------------------------------------------------------
        # Protection anti-bots : blocage des requêtes sans User-Agent
        # ------------------------------------------------------------------
        if ($http_user_agent = "") {
            return 400 "Bad Request: User-Agent header is required.\n";
        }

        # ------------------------------------------------------------------
        # En-têtes de sécurité globaux (OWASP recommendations)
        # ------------------------------------------------------------------
        add_header X-Frame-Options           "DENY"                            always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-XSS-Protection          "1; mode=block"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'none'; connect-src 'self' wss:; script-src 'none'; object-src 'none';" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # HSTS (Strict-Transport-Security) – décommentez en production HTTPS uniquement
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ------------------------------------------------------------------
        # Rate limiting global (toutes routes)
        # ------------------------------------------------------------------
        limit_req zone=global_zone burst=100 nodelay;

        # ==================================================================
        # 1. Routes REST du microservice Messaging
        # ==================================================================
        location ~ ^/api/(conversations|messages|notifications) {
            # Rate limiting strict pour l'API
            limit_req zone=api_zone burst=40 nodelay;

            proxy_pass         http://messaging_backend;
            proxy_http_version 1.1;

            # En-têtes de proxy standard
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Propagation du X-Request-ID pour l'observabilité distribuée
            proxy_set_header X-Request-ID      $http_x_request_id;

            # Désactiver la transmission du header Authorization à des fins de log Nginx
            # (le JWT est transmis au backend mais pas loggé par Nginx)
            proxy_pass_header Authorization;

            # Timeouts REST standards
            proxy_connect_timeout  5s;
            proxy_read_timeout    15s;
            proxy_send_timeout    15s;

            # Buffering pour les réponses REST
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }

        # ==================================================================
        # 2. Proxy WebSocket Temps Réel
        # ==================================================================
        location /ws {
            # Rate limiting spécifique aux connexions WebSocket
            limit_req zone=ws_zone burst=10 nodelay;

            proxy_pass         http://messaging_backend;
            proxy_http_version 1.1;

            # En-têtes obligatoires pour la mise à niveau HTTP -> WebSocket
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID    $http_x_request_id;

            # Timeouts longs nécessaires pour les connexions WebSocket persistantes (1 heure)
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout  10s;

            # Désactiver le buffering pour éviter les latences sur les messages instantanés
            proxy_buffering off;
        }

        # ==================================================================
        # 3. Supervision & Documentation Swagger (rate limiting allégé)
        # ==================================================================
        location ~ ^/(health|ready|swagger) {
            limit_req zone=health_zone burst=20 nodelay;

            proxy_pass         http://messaging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout  5s;
            proxy_read_timeout    10s;
        }

        # ==================================================================
        # 4. Sécurité : Blocage absolu des routes internes inter-services
        # ==================================================================
        # Les routes /internal/ ne doivent JAMAIS être exposées par la Gateway.
        # Elles sont réservées aux communications inter-microservices sur le réseau Docker interne.
        location /internal/ {
            return 403 "Forbidden: Internal endpoints are not exposed through the Gateway.\n";
        }

        # ==================================================================
        # 5. Route par défaut – rejeter tout ce qui n'est pas défini
        # ==================================================================
        location / {
            return 404 "Not Found: The requested resource does not exist on this gateway.\n";
        }

        # ------------------------------------------------------------------
        # Pages d'erreur personnalisées
        # ------------------------------------------------------------------
        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down.","status":429}';
            add_header Content-Type application/json always;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 502 '{"error":"Bad Gateway","message":"The upstream service is temporarily unavailable.","status":502}';
            add_header Content-Type application/json always;
        }
    }

    # ==========================================================================
    # [PRODUCTION] Bloc HTTPS – décommentez et configurez les certificats TLS
    # ==========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name api.parentconnect.fr;
    #
    #     ssl_certificate     /etc/ssl/certs/parentconnect.crt;
    #     ssl_certificate_key /etc/ssl/private/parentconnect.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     # ... (répéter les blocs location ci-dessus)
    # }
    #
    # # Redirection HTTP -> HTTPS
    # server {
    #     listen 80;
    #     server_name api.parentconnect.fr;
    #     return 301 https://$host$request_uri;
    # }
}
