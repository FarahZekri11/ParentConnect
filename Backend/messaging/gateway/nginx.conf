events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Configuration pour la gestion dynamique du header Upgrade pour WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Définition de l'amont vers le microservice Messaging
    upstream messaging_backend {
        server messaging-service:8085;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. Routes REST du microservice Messaging
        # -------------------------------------------------------------
        location ~ ^/api/(conversations|messages|notifications) {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Propagation du X-Request-ID pour l'observabilité distribuée
            proxy_set_header X-Request-ID $http_x_request_id;

            # Timeouts REST standards
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # -------------------------------------------------------------
        # 2. Proxy WebSocket Temps Réel
        # -------------------------------------------------------------
        location /ws {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;

            # En-têtes obligatoires pour la mise à niveau HTTP -> WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts longs nécessaires pour les connexions WebSocket persistantes (1 heure)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Désactiver le buffering pour éviter les latences sur les messages instantanés
            proxy_buffering off;
        }

        # -------------------------------------------------------------
        # 3. Supervision & Documentation Swagger
        # -------------------------------------------------------------
        location ~ ^/(health|ready|swagger) {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # -------------------------------------------------------------
        # 4. Sécurité : Blocage absolu des routes internes
        # -------------------------------------------------------------
        location /internal/ {
            return 403 "Forbidden: Les endpoints internes ne sont pas exposés par la Gateway.\n";
        }
    }
}
