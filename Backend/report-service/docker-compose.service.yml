version: '3.8'

services:
  report-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: parentconnect/report-service:latest
    container_name: parentconnect-report-service
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8004}:8080"
    environment:
      APP_NAME: "Report Service"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8004}
      APP_PORT: 8080
      PORT: 8080
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-report-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-report_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      AUTO_MIGRATE: "true"
      AUTO_SEED: "false"
      L5_SWAGGER_GENERATE_ALWAYS: "true"
      # Eureka Service Discovery
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      EUREKA_APP_NAME: ${EUREKA_APP_NAME:-parentconnect-report}
      EUREKA_INSTANCE_HOST: ${EUREKA_INSTANCE_HOST:-parentconnect-report-service}
      EUREKA_PORT: 8080
      # Keycloak JWT Security
      KEYCLOAK_REALM_PUBLIC_KEY: ${KEYCLOAK_REALM_PUBLIC_KEY:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-parentconnect}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://keycloak:8180}
      JWT_SECRET: ${JWT_SECRET:-super_secret_parentconnect_jwt_key_2026_community}
      # RabbitMQ Message Broker
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-report_events_queue}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - parentconnect-network

networks:
  parentconnect-network:
    external: true